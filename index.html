<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Petalpost</title>
<style>
:root{--g:#2f6b4f;--gd:#1f4d36;--c:#fbf6ec;--a:#e8685a;--ad:#bf4437;--ink:#26332c;--mut:#6f7d74;--line:#e6dcc8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--c);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0}
.btn{display:block;width:100%;padding:15px 20px;border-radius:16px;font-weight:700;font-size:17px;background:var(--a);color:#fff;box-shadow:0 5px 0 var(--ad);transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ad)}
.btn.alt{background:#fff;color:var(--g);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:10px 16px;font-size:15px;border-radius:12px;box-shadow:0 3px 0 var(--ad)}
.pill{display:inline-block;padding:7px 14px;border-radius:99px;background:#e5f0e6;color:var(--gd);font-size:13px;font-weight:600}
/* HOME */
#home{min-height:100vh;padding:22px 20px 60px;position:relative;overflow:hidden;background:radial-gradient(circle at 80% 0,#f8e1d6 0,transparent 45%),radial-gradient(circle at 0 60%,#dcecd9 0,transparent 45%),var(--c)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.logo{font-family:Georgia,serif;font-weight:700;font-size:24px;color:var(--g)}
.float{position:absolute;font-size:34px;animation:fl 6s ease-in-out infinite;opacity:.9}
@keyframes fl{50%{transform:translateY(-14px) rotate(8deg)}}
.hero{text-align:center;padding-top:30px;position:relative}
.hero h1{font-size:44px;line-height:1.05;margin:18px 0 14px;color:var(--gd)}
.hero h1 em{color:var(--a)}
.hero p{color:var(--mut);font-size:17px;line-height:1.55;margin:0 auto 26px;max-width:340px}
.hero .btn{max-width:320px;margin:0 auto 16px}
.stats{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.gal .mini{border-radius:16px;overflow:hidden;border:2px solid var(--line);aspect-ratio:4/5;position:relative}
/* APP */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.ic{width:40px;height:40px;border-radius:12px;background:var(--c);font-size:18px;border:1px solid var(--line)}
.ic:disabled{opacity:.35}
.top .sp{flex:1;font-size:13px;color:var(--mut);text-align:center}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:10px;background:#efe8d8}
.cv{position:relative;height:100%;max-width:100%;aspect-ratio:4/5;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px #0002;touch-action:none}
.wb,.wf{position:absolute;left:20%;width:60%;bottom:0;height:52%;clip-path:polygon(0 0,100% 0,64% 100%,36% 100%)}
.wf{left:24%;width:52%;height:34%;z-index:1000;pointer-events:none;filter:brightness(.93);clip-path:polygon(0 0,100% 0,66% 100%,34% 100%)}
.wb{z-index:0}
.rib{position:absolute;left:50%;bottom:26%;transform:translateX(-50%);font-size:calc(var(--u)*13);z-index:1001;pointer-events:none;line-height:1}
.it{position:absolute;line-height:1;font-size:calc(var(--u)*var(--s));touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.it.sel{outline:2px dashed var(--a);outline-offset:4px;border-radius:10px}
.tools{display:flex;gap:8px;justify-content:center;padding:8px;background:#fff;border-top:1px solid var(--line)}
.tools .ic{width:46px}
.tabs{display:flex;gap:8px;padding:10px 12px 4px;background:#fff;overflow-x:auto}
.tab{flex:none;padding:8px 16px;border-radius:99px;background:var(--c);border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:14px}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.pal{display:flex;gap:10px;padding:8px 12px 14px;background:#fff;overflow-x:auto;min-height:84px}
.pi{flex:none;width:62px;height:62px;border-radius:16px;background:var(--c);border:2px solid var(--line);font-size:32px;display:flex;align-items:center;justify-content:center}
.pi.on{border-color:var(--a)}
.pi .sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0002}
/* MODAL */
.ov{position:fixed;inset:0;background:#1f2a24aa;display:flex;align-items:flex-end;justify-content:center;z-index:5000;padding:0}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px 26px}
.sheet h2{margin:0 0 4px;color:var(--g);font-size:26px}
.steps{display:flex;gap:6px;margin:14px 0 18px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--a)}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
input,textarea{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#fffdf8;color:var(--ink)}
textarea{min-height:140px;resize:vertical;font-family:'Segoe Script','Bradley Hand','Comic Sans MS',cursive}
input:focus,textarea:focus{outline:0;border-color:var(--a)}
.cnt{text-align:right;color:var(--mut);font-size:13px;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px;border-radius:16px;border:2px solid var(--line);background:#fff;text-align:left;font-weight:700;color:var(--ink)}
.opt small{display:block;color:var(--mut);font-weight:500;margin-top:3px}
.opt.on{border-color:var(--a);background:#fff4f1}
.row{display:flex;gap:10px;margin-top:20px}
.row .btn{flex:1}
.x{float:right;width:38px;height:38px;border-radius:50%;background:var(--c);font-size:18px}
.sum{background:var(--c);border-radius:16px;padding:14px;font-size:15px;line-height:1.7}
.qrbox{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;margin:16px auto 8px;max-width:300px}
.qrbox canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.note{color:var(--mut);font-size:13px;line-height:1.5;text-align:center;margin:8px 0}
.warn{background:#fff4f1;border:2px solid #f3c9c2;color:#8a2f24;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;margin-top:14px}
.tl{background:none;color:var(--g);text-decoration:underline;font-size:1
