<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Petalpost</title>
<style>
:root{--g:#2f6b4f;--gd:#1f4d36;--c:#fbf6ec;--a:#e8685a;--ad:#bf4437;--ink:#26332c;--mut:#6f7d74;--line:#e6dcc8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--c);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0}
.btn{display:block;width:100%;padding:15px 20px;border-radius:16px;font-weight:700;font-size:17px;background:var(--a);color:#fff;box-shadow:0 5px 0 var(--ad);transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ad)}
.btn.alt{background:#fff;color:var(--g);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.sm{display:inline-block;width:auto;padding:10px 16px;font-size:15px;border-radius:12px;box-shadow:0 3px 0 var(--ad)}
.pill{display:inline-block;padding:7px 14px;border-radius:99px;background:#e5f0e6;color:var(--gd);font-size:13px;font-weight:600}
/* HOME */
#home{min-height:100vh;padding:22px 20px 60px;position:relative;overflow:hidden;background:radial-gradient(circle at 80% 0,#f8e1d6 0,transparent 45%),radial-gradient(circle at 0 60%,#dcecd9 0,transparent 45%),var(--c)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.logo{font-family:Georgia,serif;font-weight:700;font-size:24px;color:var(--g);display:flex;align-items:center;gap:8px}
.logo svg{width:30px;height:30px}
.float{position:absolute;width:48px;height:48px;animation:fl 6s ease-in-out infinite;opacity:.95}
@keyframes fl{50%{transform:translateY(-14px) rotate(8deg)}}
.hero{text-align:center;padding-top:30px;position:relative}
.hero h1{font-size:44px;line-height:1.05;margin:18px 0 14px;color:var(--gd)}
.hero h1 em{color:var(--a)}
.hero p{color:var(--mut);font-size:17px;line-height:1.55;margin:0 auto 26px;max-width:340px}
.hero .btn{max-width:320px;margin:0 auto 16px}
.stats{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.gal .mini{border-radius:16px;overflow:hidden;border:2px solid var(--line);aspect-ratio:4/5;position:relative}
/* APP */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}
.ic{width:40px;height:40px;border-radius:12px;background:var(--c);font-size:18px;border:1px solid var(--line)}
.ic:disabled{opacity:.35}
.top .sp{flex:1;font-size:13px;color:var(--mut);text-align:center}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:10px;background:#efe8d8}
.cv{position:relative;height:100%;max-width:100%;aspect-ratio:4/5;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px #0002;touch-action:none}
.wb,.wf{position:absolute;left:20%;width:60%;bottom:0;height:52%;clip-path:polygon(0 0,100% 0,64% 100%,36% 100%)}
.wf{left:24%;width:52%;height:34%;z-index:1000;pointer-events:none;filter:brightness(.93);clip-path:polygon(0 0,100% 0,66% 100%,34% 100%)}
.wb{z-index:0}
.rib{position:absolute;left:50%;bottom:26%;transform:translateX(-50%);width:calc(var(--u)*20);height:calc(var(--u)*14);z-index:1001;pointer-events:none}
.rib svg{width:100%;height:100%;display:block}
.it{position:absolute;width:calc(var(--u)*var(--s)*1.35);height:calc(var(--u)*var(--s)*1.35);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.it svg{width:100%;height:100%;display:block;pointer-events:none}
.it.sel{outline:2px dashed var(--a);outline-offset:2px;border-radius:12px}
.tools{display:flex;gap:8px;justify-content:center;padding:8px;background:#fff;border-top:1px solid var(--line)}
.tools .ic{width:46px}
.tabs{display:flex;gap:8px;padding:10px 12px 4px;background:#fff;overflow-x:auto}
.tab{flex:none;padding:8px 16px;border-radius:99px;background:var(--c);border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:14px}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.pal{display:flex;gap:10px;padding:8px 12px 14px;background:#fff;overflow-x:auto;min-height:84px}
.pi{flex:none;width:62px;height:62px;border-radius:16px;background:var(--c);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;padding:6px}
.pi svg{width:100%;height:100%;display:block}
.pi.on{border-color:var(--a)}
.pi .sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0002}
/* MODAL */
.ov{position:fixed;inset:0;background:#1f2a24aa;display:flex;align-items:flex-end;justify-content:center;z-index:5000;padding:0}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:22px 20px 26px}
.sheet h2{margin:0 0 4px;color:var(--g);font-size:26px}
.steps{display:flex;gap:6px;margin:14px 0 18px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--a)}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:15px}
input,textarea{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#fffdf8;color:var(--ink)}
textarea{min-height:140px;resize:vertical;font-family:'Segoe Script','Bradley Hand','Comic Sans MS',cursive}
input:focus,textarea:focus{outline:0;border-color:var(--a)}
.cnt{text-align:right;color:var(--mut);font-size:13px;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px;border-radius:16px;border:2px solid var(--line);background:#fff;text-align:left;font-weight:700;color:var(--ink)}
.opt small{display:block;color:var(--mut);font-weight:500;margin-top:3px}
.opt.on{border-color:var(--a);background:#fff4f1}
.row{display:flex;gap:10px;margin-top:20px}
.row .btn{flex:1}
.x{float:right;width:38px;height:38px;border-radius:50%;background:var(--c);font-size:18px}
.sum{background:var(--c);border-radius:16px;padding:14px;font-size:15px;line-height:1.7}
.qrbox{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;margin:16px auto 8px;max-width:300px}
.qrbox canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.note{color:var(--mut);font-size:13px;line-height:1.5;text-align:center;margin:8px 0}
.warn{background:#fff4f1;border:2px solid #f3c9c2;color:#8a2f24;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;margin-top:14px}
.tl{background:none;color:var(--g);text-decoration:underline;font-size:14px;padding:6px;display:block;margin:6px auto 0}
/* VIEW */
#view{min-height:100vh;padding:20px;text-align:center;background:radial-gradient(circle at 50% 0,#f8e1d6 0,transparent 55%),var(--c)}
#view .cv{height:auto;width:100%;max-width:380px;margin:14px auto;aspect-ratio:4/5}
.lockbox{max-width:360px;margin:60px auto;background:#fff;border-radius:24px;padding:26px;border:2px solid var(--line)}
.card{border-radius:20px;padding:26px 22px;text-align:left;box-shadow:0 10px 30px #0003;margin:10px 0}
.card .hd{font-family:Georgia,serif;font-size:22px;margin-bottom:12px}
.card .tx{font-family:'Segoe Script','Bradley Hand','Comic Sans MS',cursive;font-size:19px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.card .fr{margin-top:16px;text-align:right;font-style:italic}
.paper{background:#fffdf7;color:#3b3b3b}.love{background:#ffe3e8;color:#8a1c3a}.night{background:#1f2a44;color:#f3e9c6}.garden{background:#e5f3e8;color:#1f4d36}
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <span class="float" id="fl1" style="left:6%;top:18%"></span>
  <span class="float" id="fl2" style="right:8%;top:14%;animation-delay:1s"></span>
  <span class="float" id="fl3" style="left:10%;top:62%;animation-delay:2s"></span>
  <span class="float" id="fl4" style="right:6%;top:58%;animation-delay:3s"></span>
  <div class="nav"><div class="logo"><span id="logoic"></span>Petalpost</div><span class="pill">Free forever</span></div>
  <div class="hero">
    <span class="pill">No account needed</span>
    <h1>Say it with <em>flowers.</em><br>Send it in seconds.</h1>
    <p>Arrange a pretty digital bouquet, tuck in a heartfelt note, and share it with a scannable QR code.</p>
    <button class="btn" onclick="openApp()">Make a bouquet →</button>
    <button class="btn alt" onclick="document.getElementById('galwrap').scrollIntoView({behavior:'smooth'})">Browse ideas</button>
    <div class="stats"><span class="pill">📱 Scan to open</span><span class="pill">⏰ Timed reveal</span><span class="pill">🎶 Music</span></div>
  </div>
  <div id="galwrap" style="margin-top:50px;position:relative">
    <h3 style="margin:0;color:var(--gd);font-size:22px">Start from an idea</h3>
    <div class="gal" id="gal"></div>
  </div>
</div>

<!-- BUILDER -->
<div id="app" class="hidden">
  <div class="top">
    <button class="ic" onclick="goHome()" title="Home">🏠</button>
    <button class="ic" id="undo" onclick="undo()" title="Undo">↩️</button>
    <button class="ic" onclick="clearAll()" title="Clear">🧹</button>
    <div class="sp" id="hint">Tap an item below to add</div>
    <button class="btn sm" onclick="openWizard()">Send 💌</button>
  </div>
  <div class="stage"><div class="cv" id="cv"></div></div>
  <div class="tools hidden" id="tools">
    <button class="ic" onclick="scale(-2)">➖</button>
    <button class="ic" onclick="scale(2)">➕</button>
    <button class="ic" onclick="rot(-15)">⟲</button>
    <button class="ic" onclick="rot(15)">⟳</button>
    <button class="ic" onclick="front()">⬆️</button>
    <button class="ic" onclick="del()">🗑️</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="pal" id="pal"></div>
</div>

<!-- VIEW -->
<div id="view" class="hidden"></div>

<!-- WIZARD -->
<div class="ov hidden" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ---------- ART (vector flowers) ---------- */
const svgw=b=>`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${b}</svg>`;
const P=(n,rx,ry,d,f,s,o=0)=>{let h='';for(let i=0;i<n;i++)h+=`<ellipse cx="50" cy="${50-d}" rx="${rx}" ry="${ry}" fill="${f}" stroke="${s}" stroke-width="1.5" transform="rotate(${o+i*360/n} 50 50)"/>`;return h};
const ART=[
/* 0 Rose */ P(6,17,17,22,'#e5495f','#a8213a')+P(5,12,12,12,'#cf3450','#a8213a',20)+'<circle cx="50" cy="50" r="12" fill="#b02440"/><path d="M50 42 q10 0 9 9 q-1 9 -10 8" fill="none" stroke="#7d1428" stroke-width="2" stroke-linecap="round"/>',
/* 1 Tulip */ '<path d="M26 30 Q22 78 50 84 Q78 78 74 30 L62 50 L50 24 L38 50 Z" fill="#f2587c" stroke="#b92f55" stroke-width="2" stroke-linejoin="round"/><path d="M50 24 Q40 60 50 84 Q60 60 50 24Z" fill="#f98aa6" stroke="#b92f55" stroke-width="1.5"/>',
/* 2 Sunflower */ P(14,7,17,31,'#ffc928','#d98f00')+P(14,7,15,27,'#ffdc57','#d98f00',12.8)+'<circle cx="50" cy="50" r="20" fill="#6b3d1e"/><circle cx="50" cy="50" r="13" fill="#4a2813"/><circle cx="46" cy="46" r="2" fill="#8a5a33"/><circle cx="55" cy="48" r="2" fill="#8a5a33"/><circle cx="50" cy="55" r="2" fill="#8a5a33"/>',
/* 3 Cherry blossom */ P(5,15,17,22,'#ffcadb','#ee8fb0')+'<circle cx="50" cy="50" r="7" fill="#ffd54a"/><circle cx="50" cy="50" r="3" fill="#e8a000"/>',
/* 4 Hibiscus */ P(5,19,24,22,'#ff7d6d','#d84a3c')+'<circle cx="50" cy="50" r="9" fill="#ffd0a0"/><path d="M50 50 L68 30" stroke="#c4402f" stroke-width="3" stroke-linecap="round"/><circle cx="68" cy="30" r="4" fill="#ffd54a" stroke="#c4402f" stroke-width="1.5"/>',
/* 5 Lavender */ (()=>{let h='<path d="M50 96 L50 14" stroke="#5a9a63" stroke-width="3" fill="none"/>';for(let i=0;i<8;i++){const y=18+i*9;h+=`<ellipse cx="43" cy="${y}" rx="6" ry="4.5" fill="#9b7fd6" transform="rotate(-25 43 ${y})"/><ellipse cx="57" cy="${y+4}" rx="6" ry="4.5" fill="#b49af0" transform="rotate(25 57 ${y+4})"/>`}return h})(),
/* 6 Daisy */ P(12,5,17,30,'#ffffff','#cfcfcf')+'<circle cx="50" cy="50" r="11" fill="#ffcf33" stroke="#e0a000" stroke-width="1.5"/>',
/* 7 Peony */ P(8,16,18,26,'#f8aac6','#d9769d')+P(7,14,15,16,'#f48fb4','#d9769d',20)+P(6,11,11,8,'#ee729f','#c95583',10)+'<circle cx="50" cy="50" r="6" fill="#d9548a"/>',
/* 8 Lotus */ [-62,62,-32,32,0].map((a,i)=>`<path d="M50 62 Q32 38 50 8 Q68 38 50 62Z" fill="${['#f8b6cf','#f8b6cf','#f59ac0','#f59ac0','#f27fb0'][i]}" stroke="#d2679a" stroke-width="1.5" transform="rotate(${a} 50 62)"/>`).join('')+'<ellipse cx="50" cy="66" rx="14" ry="5" fill="#ffd54a" opacity=".9"/>',
/* 9 Marigold */ P(16,6,12,30,'#ff9d1c','#d97500')+P(14,6,11,22,'#ffb83d','#d97500',11)+P(12,5,9,14,'#ffc95e','#d97500')+'<circle cx="50" cy="50" r="7" fill="#e07b00"/>',
/* 10 Poppy */ P(4,23,23,20,'#ee3b32','#b61e17',45)+'<circle cx="50" cy="50" r="9" fill="#2b1b1b"/>'+[0,1,2,3,4,5,6,7].map(i=>`<circle cx="${50+16*Math.cos(i*Math.PI/4)}" cy="${50+16*Math.sin(i*Math.PI/4)}" r="2" fill="#2b1b1b"/>`).join(''),
/* 11 Wheat */ (()=>{let h='<path d="M50 96 L50 18" stroke="#b8943f" stroke-width="3" fill="none"/><ellipse cx="50" cy="12" rx="4" ry="9" fill="#e0b660" stroke="#b8943f"/>';for(let i=0;i<6;i++){const y=26+i*11;h+=`<ellipse cx="41" cy="${y}" rx="4" ry="9" fill="#e8c26a" stroke="#b8943f" transform="rotate(-30 41 ${y})"/><ellipse cx="59" cy="${y}" rx="4" ry="9" fill="#e8c26a" stroke="#b8943f" transform="rotate(30 59 ${y})"/>`}return h})(),
/* 12 Leaf */ '<path d="M50 94 Q10 60 50 6 Q90 60 50 94Z" fill="#4f9d69" stroke="#37754d" stroke-width="2"/><path d="M50 90 L50 22" stroke="#37754d" stroke-width="2" fill="none"/><path d="M50 60 L34 46 M50 48 L66 34 M50 72 L66 58" stroke="#37754d" stroke-width="1.5" fill="none"/>',
/* 13 Round leaves */ '<path d="M50 96 Q46 50 54 8" stroke="#6aa585" stroke-width="3" fill="none"/>'+[[40,80,10],[60,70,10],[40,56,9],[62,44,9],[44,30,8],[55,14,7]].map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}" fill="#9ccbb0" stroke="#6aa585" stroke-width="1.5"/>`).join(''),
/* 14 Clover */ '<path d="M50 60 Q52 80 46 96" stroke="#3d8450" stroke-width="3" fill="none"/>'+[[50,34],[34,58],[66,58]].map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="20" fill="#58a96b" stroke="#3d8450" stroke-width="1.5"/>`).join(''),
/* 15 Sprig */ (()=>{let h='<path d="M50 96 Q48 50 58 6" stroke="#4f9d69" stroke-width="3" fill="none"/>';for(let i=0;i<6;i++){const y=82-i*13,x=50+(i*1.3);h+=`<ellipse cx="${x-9}" cy="${y}" rx="4.5" ry="9" fill="#6fbf84" stroke="#3d8450" transform="rotate(-50 ${x-9} ${y})"/><ellipse cx="${x+9}" cy="${y-4}" rx="4.5" ry="9" fill="#6fbf84" stroke="#3d8450" transform="rotate(50 ${x+9} ${y-4})"/>`}return h})(),
/* 16 Baby's breath */ '<path d="M50 96 Q50 60 50 40 M50 70 Q32 56 24 36 M50 62 Q68 50 78 30 M50 52 Q40 36 38 16" stroke="#6aa86f" stroke-width="2" fill="none"/>'+[[50,38,5],[24,34,5],[78,28,5],[38,14,5],[30,46,4],[70,42,4],[44,26,4],[60,34,4],[16,28,3],[86,20,3]].map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}" fill="#fff" stroke="#d6d6d6" stroke-width="1"/>`).join(''),
/* 17 Butterfly */ (w=>'<g>'+w+'</g><g transform="translate(100,0) scale(-1,1)">'+w+'</g><ellipse cx="50" cy="52" rx="3.5" ry="17" fill="#5a3a5e"/><path d="M48 36 Q42 24 38 22 M52 36 Q58 24 62 22" stroke="#5a3a5e" stroke-width="1.5" fill="none"/>')('<path d="M47 48 Q8 8 10 44 Q12 64 47 56Z" fill="#f58fb8" stroke="#c9588a" stroke-width="1.5"/><path d="M47 58 Q16 60 26 86 Q42 86 47 62Z" fill="#f9b8d3" stroke="#c9588a" stroke-width="1.5"/><circle cx="24" cy="36" r="5" fill="#fff" opacity=".7"/>'),
/* 18 Sparkle */ '<path d="M50 6 Q54 46 94 50 Q54 54 50 94 Q46 54 6 50 Q46 46 50 6Z" fill="#ffd44d" stroke="#e0a800" stroke-width="2" stroke-linejoin="round"/>',
/* 19 Berries */ '<path d="M50 96 Q48 60 50 36 M50 70 Q34 56 28 40 M50 62 Q66 50 72 34" stroke="#5a8a5f" stroke-width="2.5" fill="none"/>'+[[50,32],[28,36],[72,30]].map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="10" fill="#c2303f" stroke="#8d1f2c" stroke-width="1.5"/><circle cx="${a[0]-3}" cy="${a[1]-3}" r="2.5" fill="#f08a95"/>`).join(''),
/* 20 Cherry */ '<path d="M34 72 Q40 40 54 16 M68 66 Q64 36 54 16" stroke="#5a8a5f" stroke-width="2.5" fill="none"/><path d="M54 16 Q74 6 84 20 Q66 26 54 16Z" fill="#4f9d69" stroke="#37754d" stroke-width="1.5"/><circle cx="34" cy="74" r="14" fill="#d1243d" stroke="#8d1527" stroke-width="1.5"/><circle cx="68" cy="68" r="14" fill="#d1243d" stroke="#8d1527" stroke-width="1.5"/><circle cx="29" cy="68" r="3" fill="#f58a99"/><circle cx="63" cy="62" r="3" fill="#f58a99"/>',
/* 21 Bee */ '<defs><clipPath id="bc"><ellipse cx="50" cy="58" rx="24" ry="17"/></clipPath></defs><ellipse cx="38" cy="34" rx="12" ry="16" fill="#d6eeff" stroke="#8ab6d8" stroke-width="1.5" opacity=".9" transform="rotate(-25 38 34)"/><ellipse cx="62" cy="34" rx="12" ry="16" fill="#d6eeff" stroke="#8ab6d8" stroke-width="1.5" opacity=".9" transform="rotate(25 62 34)"/><ellipse cx="50" cy="58" rx="24" ry="17" fill="#ffcf33"/><g clip-path="url(#bc)"><rect x="40" y="38" width="7" height="40" fill="#3a2a10"/><rect x="54" y="38" width="7" height="40" fill="#3a2a10"/></g><ellipse cx="50" cy="58" rx="24" ry="17" fill="none" stroke="#3a2a10" stroke-width="2"/><circle cx="28" cy="56" r="3" fill="#3a2a10"/>',
/* 22 Star */ '<polygon points="50,8 61,38 93,38 67,57 77,90 50,70 23,90 33,57 7,38 39,38" fill="#ffd44d" stroke="#e0a800" stroke-width="2" stroke-linejoin="round"/>',
/* 23 Heart */ '<path d="M50 86 C10 56 14 22 36 22 C44 22 50 28 50 34 C50 28 56 22 64 22 C86 22 90 56 50 86Z" fill="#ef5a78" stroke="#b52d4b" stroke-width="2" stroke-linejoin="round"/><path d="M30 36 Q26 44 32 52" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>'
];
const BOW='<svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg"><path d="M50 36 Q18 0 6 18 Q0 44 50 38Z" fill="#e8685a" stroke="#b9443a" stroke-width="2"/><path d="M50 36 Q82 0 94 18 Q100 44 50 38Z" fill="#e8685a" stroke="#b9443a" stroke-width="2"/><path d="M46 40 L34 68 L46 62 L50 66Z M54 40 L66 68 L54 62 L50 66Z" fill="#d6554a" stroke="#b9443a" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="50" cy="37" rx="8" ry="9" fill="#f08577" stroke="#b9443a" stroke-width="2"/></svg>';
const art=k=>svgw(ART[k]||ART[0]);
const FLN=12,TOT=ART.length;
const WR=[{n:'Blush',c:'#f7b6c2'},{n:'Cream',c:'#f5e6c8'},{n:'Mint',c:'#a8dcc0'},{n:'Lilac',c:'#c9b6ea'},{n:'Kraft',c:'#c9a37a'},{n:'Sky',c:'#a9d3f0'}];
const BG=['#fff3ee','#e8f3e6','#efe7f8','#fff8d9','#dff1f5','#ffe0e6','#2b3a33'];
const PRE=[
 [{k:2,x:35,y:34,s:22,r:-8},{k:2,x:65,y:34,s:22,r:8},{k:6,x:50,y:24,s:17,r:0},{k:12,x:24,y:48,s:14,r:-40},{k:12,x:76,y:48,s:14,r:40},{k:6,x:50,y:44,s:15,r:0}],
 [{k:0,x:36,y:32,s:21,r:-10},{k:0,x:64,y:32,s:21,r:10},{k:0,x:50,y:22,s:21,r:0},{k:12,x:25,y:46,s:14,r:-50},{k:12,x:75,y:46,s:14,r:50},{k:18,x:50,y:42,s:12,r:0}],
 [{k:1,x:34,y:32,s:20,r:-12},{k:3,x:66,y:32,s:20,r:12},{k:5,x:50,y:22,s:20,r:0},{k:17,x:78,y:20,s:12,r:20},{k:15,x:50,y:44,s:15,r:0}]
];
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={w:0,bg:0,items:[]},sel=null,hist=[],tab='Flowers',W={msg:'',to:'',from:'',card:'paper',music:'none',pass:'',date:''},step=0,uid=1;

/* ---------- rendering ---------- */
function draw(el,st,edit){
  el.style.background=BG[st.bg];
  el.style.setProperty('--u',(el.clientWidth/100)+'px');
  const w=WR[st.w].c;
  el.innerHTML=`<div class="wb" style="background:${w}"></div>`+
    st.items.map((it,i)=>`<div class="it ${edit&&it.id===sel?'sel':''}" data-id="${it.id}" style="--s:${it.s};left:${it.x}%;top:${it.y}%;transform:translate(-50%,-50%) rotate(${it.r}deg);z-index:${i+1}">${art(it.k)}</div>`).join('')+
    `<div class="wf" style="background:${w}"></div><div class="rib">${BOW}</div>`;
  if(edit)el.querySelectorAll('.it').forEach(n=>n.addEventListener('pointerdown',e=>dragStart(e,n)));
}
function redraw(){draw($('cv'),S,true);$('tools').classList.toggle('hidden',sel==null);$('hint').textContent=sel==null?'Tap an item below to add':'Drag to move';$('undo').disabled=!hist.length}
function snap(){hist.push(JSON.stringify(S));if(hist.length>40)hist.shift()}
function undo(){if(!hist.length)return;S=JSON.parse(hist.pop());sel=null;redraw()}
function clearAll(){if(S.items.length&&confirm('Clear all flowers?')){snap();S.items=[];sel=null;redraw()}}
const cur=()=>S.items.find(i=>i.id===sel);
function scale(d){const it=cur();if(!it)return;snap();it.s=Math.max(6,Math.min(50,it.s+d));redraw()}
function rot(d){const it=cur();if(!it)return;snap();it.r+=d;redraw()}
function front(){const i=S.items.findIndex(x=>x.id===sel);if(i<0)return;snap();S.items.push(S.items.splice(i,1)[0]);redraw()}
function del(){snap();S.items=S.items.filter(i=>i.id!==sel);sel=null;redraw()}
function addItem(k){snap();const it={id:uid++,k,x:50+(Math.random()*30-15),y:30+(Math.random()*16-8),s:18,r:Math.round(Math.random()*40-20)};S.items.push(it);sel=it.id;redraw()}
function dragStart(ev,n){
  ev.preventDefault();const id=+n.dataset.id;sel=id;const it=cur();snap();
  document.querySelectorAll('.it').forEach(x=>x.classList.toggle('sel',x===n));
  $('tools').classList.remove('hidden');
  const cv=$('cv'),mv=e=>{const r=cv.getBoundingClientRect();it.x=Math.max(2,Math.min(98,(e.clientX-r.left)/r.width*100));it.y=Math.max(2,Math.min(98,(e.clientY-r.top)/r.height*100));n.style.left=it.x+'%';n.style.top=it.y+'%'};
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);redraw()};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
}
document.addEventListener('pointerdown',e=>{if(e.target.id==='cv'){sel=null;redraw()}});

/* ---------- palette ---------- */
function renderTabs(){
  $('tabs').innerHTML=['Flowers','Fillers','Wrappers','Backdrop'].map(t=>`<button class="tab ${t===tab?'on':''}" onclick="tab='${t}';renderTabs()">${t}</button>`).join('');
  let h='';
  if(tab==='Flowers')for(let k=0;k<FLN;k++)h+=`<button class="pi" onclick="addItem(${k})">${art(k)}</button>`;
  if(tab==='Fillers')for(let k=FLN;k<TOT;k++)h+=`<button class="pi" onclick="addItem(${k})">${art(k)}</button>`;
  if(tab==='Wrappers')h=WR.map((w,i)=>`<button class="pi ${S.w===i?'on':''}" onclick="snap();S.w=${i};renderTabs();redraw()"><span class="sw" style="background:${w.c}"></span></button>`).join('');
  if(tab==='Backdrop')h=BG.map((b,i)=>`<button class="pi ${S.bg===i?'on':''}" onclick="snap();S.bg=${i};renderTabs();redraw()"><span class="sw" style="background:${b}"></span></button>`).join('');
  $('pal').innerHTML=h;
}

/* ---------- navigation ---------- */
function openApp(p){$('home').classList.add('hidden');$('view').classList.add('hidden');$('app').classList.remove('hidden');
  if(p!=null){S={w:p%WR.length,bg:p,items:PRE[p].map(i=>({...i,id:uid++}))};hist=[];sel=null}
  renderTabs();setTimeout(redraw,30)}
function goHome(){$('app').classList.add('hidden');$('view').classList.add('hidden');$('home').classList.remove('hidden')}
function buildGallery(){
  $('gal').innerHTML=PRE.map((_,i)=>`<div class="mini" onclick="openApp(${i})" id="g${i}"></div>`).join('');
  PRE.forEach((p,i)=>draw($('g'+i),{w:i,bg:i,items:p.map(x=>({...x,id:i*100+Math.random()}))},false));
  $('fl1').innerHTML=art(1);$('fl2').innerHTML=art(17);$('fl3').innerHTML=art(6);$('fl4').innerHTML=art(12);$('logoic').innerHTML=art(3);
}

/* ---------- wizard ---------- */
const STEPS=['Message','Recipient','Card','Music','Lock','Review'];
function openWizard(){if(!S.items.length){alert('Add some flowers first 🌸');return}step=0;$('ov').classList.remove('hidden');wiz()}
function closeWiz(){$('ov').classList.add('hidden');stopMusic()}
function wiz(){
  let b='';
  if(step==0)b=`<label>Your message</label><textarea id="f_msg" maxlength="500" placeholder="Write something from the heart…" oninput="W.msg=this.value;$('c').textContent=this.value.length+'/500'">${esc(W.msg)}</textarea><div class="cnt" id="c">${W.msg.length}/500</div>`;
  if(step==1)b=`<label>Dearest…</label><input id="f_to" value="${esc(W.to)}" placeholder="Friend" oninput="W.to=this.value"><label>From (optional)</label><input value="${esc(W.from)}" placeholder="A secret admirer" oninput="W.from=this.value">`;
  if(step==2)b=`<label>Choose a card style</label><div class="opts">${[['paper','📜 Paper','Classic cream'],['love','💗 Love letter','Soft rose'],['night','🌙 Midnight','Deep & cosy'],['garden','🌿 Garden','Fresh green']].map(o=>`<button class="opt ${W.card==o[0]?'on':''}" onclick="W.card='${o[0]}';wiz()">${o[1]}<small>${o[2]}</small></button>`).join('')}</div>`;
  if(step==3)b=`<label>Background music</label><div class="opts">${[['none','🔇 None','Silent'],['chime','🔔 Chimes','Sparkly & light'],['lull','🎹 Lullaby','Slow & sweet']].map(o=>`<button class="opt ${W.music==o[0]?'on':''}" onclick="W.music='${o[0]}';playMusic('${o[0]}');wiz()">${o[1]}<small>${o[2]}</small></button>`).join('')}</div>`;
  if(step==4)b=`<label>Passcode (optional)</label><input value="${esc(W.pass)}" placeholder="e.g. 1234" oninput="W.pass=this.value"><label>Reveal on (optional)</label><input type="datetime-local" value="${esc(W.date)}" onchange="W.date=this.value"><p style="color:var(--mut);font-size:13px">Locks are a fun surprise feature, not real security.</p>`;
  if(step==5)b=`<div class="sum">💐 ${S.items.length} items<br>💌 To: <b>${esc(W.to||'Friend')}</b> — from <b>${esc(W.from||'A Secret Admirer')}</b><br>🎨 Card: ${W.card} · 🎶 ${W.music}<br>🔒 ${W.pass?'Passcode on':'No passcode'} · ⏰ ${W.date?new Date(W.date).toLocaleString():'Opens right away'}</div><div id="out"></div>`;
  $('sheet').innerHTML=`<button class="x" onclick="closeWiz()">✕</button><h2>Wrap your bouquet</h2><div class="steps">${STEPS.map((s,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><div style="color:var(--mut);font-size:13px;font-weight:700">STEP ${step+1} · ${STEPS[step].toUpperCase()}</div>${b}
  <div class="row">${step>0?'<button class="btn alt" onclick="step--;wiz()">Back</button>':''}${step<5?'<button class="btn" onclick="next()">Next</button>':'<button class="btn" onclick="makeQR()">Create QR code 📱</button>'}</div>`;
}
function next(){if(step==0&&!W.msg.trim()){alert('Write a little note first 💌');return}stopMusic();step++;wiz()}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}
/* compact format keeps the QR code small */
function payload(){
  const items=S.items.map(i=>[i.k,+i.x.toFixed(0),+i.y.toFixed(0),i.s,i.r]);
  return enc({s:[S.w,S.bg,items],m:W.msg,t:W.to||'Friend',f:W.from||'A Secret Admirer',c:W.card,mu:W.music,p:W.pass,d:W.date});
}
function expand(d){
  if(Array.isArray(d.s))d.s={w:d.s[0],bg:d.s[1],items:d.s[2].map(a=>({k:a[0],x:a[1],y:a[2],s:a[3],r:a[4]}))};
  return d;
}

/* ---------- QR code ---------- */
function makeQR(){
  const p=payload();window._p=p;
  const link=location.href.split('#')[0]+'#v='+p;window._link=link;
  const out=$('out');
  const isFile=location.protocol==='file:';
  let warn=isFile?'<div class="warn">⚠️ You opened this page from a file on your phone. A QR code made here only works on this phone. Upload the page online (GitHub Pages etc.) and make the QR from there so others can scan it.</div>':'';
  if(typeof qrcode==='undefined'){
    out.innerHTML=`<div class="warn">The QR maker could not load. Connect to the internet and reload the page, then try again.</div>`+warn+`<button class="tl" onclick="copyLink()">Copy link instead</button>`;return;
  }
  if(link.length>2800){
    out.innerHTML=`<div class="warn">This bouquet is too big for one QR code. Try a shorter message or fewer flowers.</div><button class="tl" onclick="copyLink()">Copy link instead</button>`;return;
  }
  out.innerHTML=`<div class="qrbox"><canvas id="qrc"></canvas></div>
    <p class="note">Scan with a phone camera to open the bouquet 💐</p>
    <div class="row" style="margin-top:8px"><button class="btn sm" style="flex:1" onclick="saveQR()">Save image 💾</button><button class="btn sm" style="flex:1" onclick="shareQR()">Share ↗</button></div>
    <button class="btn alt" style="margin-top:14px" onclick="closeWiz();showView(window._p)">Preview it 👀</button>
    <button class="tl" onclick="copyLink()">Copy link instead</button>${warn}`;
  try{drawQR(link)}catch(e){out.innerHTML=`<div class="warn">Could not make a QR code. Try a shorter message.</div><button class="tl" onclick="copyLink()">Copy link instead</button>`}
}
function drawQR(text){
  const q=qrcode(0,'L');q.addData(text);q.make();
  const n=q.getModuleCount(),m=4,sc=Math.max(3,Math.floor(720/(n+2*m))),size=(n+2*m)*sc;
  const c=$('qrc');c.width=c.height=size;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#1f4d36';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*sc,(r+m)*sc,sc,sc);
}
function saveQR(){
  const c=$('qrc');if(!c)return;
  const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='petalpost-bouquet.png';
  document.body.appendChild(a);a.click();a.remove();
}
function shareQR(){
  const c=$('qrc');if(!c)return;
  c.toBlob(b=>{
    const f=new File([b],'petalpost-bouquet.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'A bouquet for you 💐'}).catch(()=>{});
    else saveQR();
  });
}
function copyLink(){const t=window._link;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Link copied!')).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');alert('Link copied!')}catch(e){alert('Could not copy the link')}a.remove()})}

/* ---------- viewer ---------- */
function showView(p){
  let d;try{d=expand(dec(p))}catch(e){return}
  $('home').classList.add('hidden');$('app').classList.add('hidden');$('view').classList.remove('hidden');
  const go=()=>{
    $('view').innerHTML=`<h1 class="serif" style="color:var(--gd);margin:6px 0">A bouquet for ${esc(d.t)} 💐</h1><div class="cv" id="vcv"></div>
    <button class="btn" style="max-width:340px;margin:0 auto 14px" onclick="openNote()">Open the note 💌</button>
    ${d.mu!=='none'?'<button class="btn alt" style="max-width:340px;margin:0 auto 14px" onclick="playMusic(\''+d.mu+'\')">🎶 Play music</button>':''}
    `;
    draw($('vcv'),d.s,false);window._d=d;autoMusic(d.mu);
  };
  const lock=()=>{
    if(d.d&&new Date(d.d)>new Date()){
      $('view').innerHTML=`<div class="lockbox"><div style="font-size:50px">⏰</div><h2 class="serif">Not yet…</h2><p>This bouquet for <b>${esc(d.t)}</b> opens on<br><b>${new Date(d.d).toLocaleString()}</b></p><div id="cd" style="font-size:22px;font-weight:700;color:var(--a)"></div></div>`;
      const t=setInterval(()=>{const ms=new Date(d.d)-new Date();if(ms<=0){clearInterval(t);lock();return}const s=Math.floor(ms/1000);if($('cd'))$('cd').textContent=`${Math.floor(s/86400)}d ${Math.floor(s%86400/3600)}h ${Math.floor(s%3600/60)}m ${s%60}s`},1000);return}
    if(d.p&&!window._ok){
      $('view').innerHTML=`<div class="lockbox"><div style="font-size:50px">🔒</div><h2 class="serif">Enter the passcode</h2><input id="pw" placeholder="Passcode" style="margin:10px 0 16px"><button class="btn" onclick="if($('pw').value===window._d.p){window._ok=1;showView('${p}')}else alert('Not quite — try again')">Unlock</button></div>`;window._d=d;return}
    go();
  };
  window._d=d;lock();
}
function openNote(){
  const d=window._d;$('ov').classList.remove('hidden');
  $('sheet').innerHTML=`<button class="x" onclick="$('ov').classList.add('hidden')">✕</button><div class="card ${d.c}"><div class="hd">Dearest ${esc(d.t)},</div><div class="tx">${esc(d.m)}</div><div class="fr">— ${esc(d.f)}</div></div>`;
}

/* ---------- music ---------- */
let AC,tmr;
function stopMusic(){clearInterval(tmr);tmr=null}
function tone(f,t,dur,vol){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur)}
function playMusic(k){
  stopMusic();if(k==='none')return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const P2=[523,587,659,784,880,1047],L=[392,440,523,440,392,330,392,294];let i=0;
  const play=()=>{if(AC.state!=='running')return;const t=AC.currentTime;if(k==='chime')tone(P2[Math.floor(Math.random()*P2.length)],t,1.6,.15);else{tone(L[i%L.length],t,1.4,.18);i++}};
  AC.resume().then(play).catch(()=>{});
  tmr=setInterval(play,k==='chime'?700:900);
}
function autoMusic(k){
  if(!k||k==='none')return;
  playMusic(k);
  const evs=['pointerdown','touchstart','keydown'];
  const start=()=>{evs.forEach(e=>document.removeEventListener(e,start));if(!AC||AC.state!=='running')playMusic(k)};
  evs.forEach(e=>document.addEventListener(e,start));
}

/* ---------- init ---------- */
window.addEventListener('resize',()=>{if(!$('app').classList.contains('hidden'))redraw()});
function route(){const m=location.hash.match(/#v=(.+)/);if(m)showView(m[1])}
window.addEventListener('hashchange',route);
buildGallery();renderTabs();route();
</script>
</body>
